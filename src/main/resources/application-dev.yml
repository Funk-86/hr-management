# 本地开发配置（默认 profile: dev）

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hr_management?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  flyway:
    baseline-on-migrate: true
    # 与「已有完整业务表（含任务大厅）」的本地库对齐；无待跑迁移。
    # 注意：baseline 只在「flyway 历史表不存在」时生效；
    # 若只 DELETE 行而留着空表，Flyway 会从 V1 重跑并报 Table already exists。
    baseline-version: 21

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.example.hrmanagement: debug

# 局域网调试：允许同 WiFi 下通过本机 IP 访问前端（http/https，如 https://10.36.98.96:5666）
app:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - https://localhost:*
      - http://127.0.0.1:*
      - https://127.0.0.1:*
      - http://10.*:*
      - https://10.*:*
      - http://192.168.*:*
      - https://192.168.*:*
      - http://172.16.*:*
      - https://172.16.*:*
      - http://172.17.*:*
      - https://172.17.*:*
      - http://172.18.*:*
      - https://172.18.*:*
      - http://172.19.*:*
      - https://172.19.*:*
      - http://172.20.*:*
      - https://172.20.*:*
      - http://172.21.*:*
      - https://172.21.*:*
      - http://172.22.*:*
      - https://172.22.*:*
      - http://172.23.*:*
      - https://172.23.*:*
      - http://172.24.*:*
      - https://172.24.*:*
      - http://172.25.*:*
      - https://172.25.*:*
      - http://172.26.*:*
      - https://172.26.*:*
      - http://172.27.*:*
      - https://172.27.*:*
      - http://172.28.*:*
      - https://172.28.*:*
      - http://172.29.*:*
      - https://172.29.*:*
      - http://172.30.*:*
      - https://172.30.*:*
      - http://172.31.*:*
      - https://172.31.*:*

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com   # 按地域修改
    access-key-id: ${ALIYUN_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET}
    bucket-name: funk1
    # 对外访问域名（可填 CDN 域名）
    public-domain: funk1.oss-cn-beijing.aliyuncs.com
    avatar:
      max-size: 2097152          # 2MB
      allowed-types: image/jpeg,image/png,image/webp
      employee-prefix: avatar/employee/
      user-prefix: avatar/user/
      default-key: avatar/default/default-avatar.png
    attachment:
      max-size: 10485760         # 10MB
      allowed-types: image/jpeg,image/png,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
      prefix: task/attachment/
    document:
      max-size: 20971520         # 20MB
      allowed-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
      prefix: employee/document/
