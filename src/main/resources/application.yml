spring:
  application:
    name: hr-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 仅当「无 flyway 表 + 库非空」时生效；本地已有完整库请用 application-dev.yml 的 21
    baseline-version: 1
    table: flyway_schema_history

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.example.hrmanagement.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:hr-management-jwt-secret-key-2026-dev-only!!}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  attendance:
    work-start-time: "09:00"
    work-end-time: "18:00"
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*

# OpenAI 兼容接口：本地 Ollama 或上线后的云端 API
ai:
  enabled: ${AI_ENABLED:true}
  base-url: ${AI_BASE_URL:http://127.0.0.1:11434/v1}
  api-key: ${AI_API_KEY:ollama}
  model: ${AI_MODEL:qwen2.5:3b}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
