services:
  mysql:
    image: mysql:8.0
    container_name: hr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hr_management}
      MYSQL_USER: ${MYSQL_USER:-hr_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hr123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: hr-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hr_management}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-hr_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-hr123456}
      JWT_SECRET: ${JWT_SECRET:-hr-docker-jwt-secret-change-me-32chars!!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:-http://localhost}
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: hr-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro

volumes:
  mysql_data:
